name: Update hero banner

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.json, scripts/build_hero.py]

permissions:
  contents: write

concurrency:
  group: update-hero
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build hero.svg from your latest repos
        run: python scripts/build_hero.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain hero.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hero.svg
            git commit -m "chore: refresh hero banner"
            git pull --rebase
            git push
          fi
